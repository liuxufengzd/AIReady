<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document Review</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    /* Babel 8 defaults to automatic JSX runtime (generates `import` statements),
       which breaks UMD builds. Register a preset that forces the classic runtime
       (React.createElement) so the compiled code works as a plain script. */
    Babel.registerPreset("classic-react", {
      presets: [[Babel.availablePresets["react"], { runtime: "classic" }]],
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked@13/marked.min.js"></script>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 0.9s linear infinite; }

    .md h1 { font-size: 1.35em; font-weight: 700; margin: 0.8em 0 0.4em; color: #1e293b; }
    .md h2 { font-size: 1.15em; font-weight: 600; margin: 0.8em 0 0.4em; color: #1e293b; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.25em; }
    .md h3 { font-size: 1.05em; font-weight: 600; margin: 0.6em 0 0.3em; color: #334155; }
    .md h4, .md h5, .md h6 { font-size: 0.95em; font-weight: 600; margin: 0.5em 0 0.25em; color: #475569; }
    .md p { margin: 0.5em 0; line-height: 1.65; color: #334155; }
    .md ul { list-style: disc; margin: 0.4em 0 0.4em 1.4em; }
    .md ol { list-style: decimal; margin: 0.4em 0 0.4em 1.4em; }
    .md li { margin: 0.2em 0; line-height: 1.55; color: #334155; }
    .md code { background: #f1f5f9; color: #1d4ed8; padding: 0.1em 0.35em; border-radius: 4px; font-family: 'Courier New', monospace; font-size: 0.83em; }
    .md pre { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 0.9em 1.1em; overflow-x: auto; margin: 0.6em 0; }
    .md pre code { background: none; color: #334155; padding: 0; }
    .md table { border-collapse: collapse; width: 100%; margin: 0.6em 0; font-size: 0.88em; }
    .md th, .md td { border: 1px solid #e2e8f0; padding: 0.45em 0.8em; text-align: left; }
    .md th { background: #f8fafc; font-weight: 600; color: #475569; }
    .md blockquote { border-left: 3px solid #94a3b8; padding: 0.3em 0.9em; color: #64748b; background: #f8fafc; border-radius: 0 6px 6px 0; margin: 0.5em 0; }
    .md a { color: #2563eb; text-decoration: underline; }
    .md strong { font-weight: 700; color: #1e293b; }
    .md em { font-style: italic; }
    .md hr { border: none; border-top: 1px solid #e2e8f0; margin: 1em 0; }
    .md img { max-width: 100%; height: auto; border-radius: 4px; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 3px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    input:focus, textarea:focus, select:focus { outline: none; }

    .review-pane {
      height: 70vh;
      min-height: 640px;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen antialiased">
  <div id="root"></div>

  <script type="text/babel" data-presets="classic-react">
    "use strict";
    const { useState, useMemo, useEffect } = React;

    const API_BASE = (function () {
      const injected = "__API_BASE_URL__";
      if (injected && injected.indexOf("__API_BASE") === -1) return injected.replace(/\/+$/, "");
      if (window.location.protocol !== "file:") return window.location.origin;
      return "http://localhost:8003";
    })();

    async function api(method, path, queryParams, body) {
      const url = new URL(API_BASE + path);
      if (queryParams) {
        for (const [k, v] of Object.entries(queryParams)) {
          if (v === null || v === undefined) continue;
          url.searchParams.set(k, String(v));
        }
      }

      const opts = { method };
      if (body !== undefined) {
        opts.headers = { "Content-Type": "application/json" };
        opts.body = JSON.stringify(body);
      }

      let resp;
      try {
        resp = await fetch(url.toString(), opts);
      } catch (e) {
        throw new Error(`Network error — is the API server running at ${API_BASE}?\n${e.message}`);
      }

      if (!resp.ok) {
        let detail = "";
        try {
          const j = await resp.json();
          detail = j.detail ? (Array.isArray(j.detail) ? JSON.stringify(j.detail, null, 2) : String(j.detail)) : JSON.stringify(j);
        } catch {
          detail = await resp.text();
        }
        throw new Error(`[${resp.status}] ${detail}`);
      }

      const text = await resp.text();
      return text.trim() ? JSON.parse(text) : null;
    }

    function fileQuery(row) {
      return { engine: row.engine };
    }

    function filePath(row, suffix) {
      return `/reviews/${encodeURIComponent(row.project)}/${encodeURIComponent(row.filename)}${suffix || ""}`;
    }

    function assetUrl(row, href) {
      const relative = String(href || "").replace(/^\.\//, "");
      const encoded = relative.split("/").map((part) => encodeURIComponent(part)).join("/");
      const url = new URL(API_BASE + filePath(row, `/assets/${encoded}`));
      url.searchParams.set("engine", row.engine);
      return url.toString();
    }

    function layoutUrl(row) {
      const url = new URL(API_BASE + filePath(row, "/layout"));
      url.searchParams.set("engine", row.engine);
      return url.toString();
    }

    function needsReview(row) {
      return row.approved === null || row.approved === undefined;
    }

    function formatWhen(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString();
    }

    function Spinner({ size = 40, color = "#2563eb" }) {
      return (
        <div
          className="spinner"
          style={{
            width: size,
            height: size,
            borderRadius: "50%",
            border: `${size / 10}px solid #e2e8f0`,
            borderTopColor: color,
          }}
        />
      );
    }

    function LoadingOverlay({ msg }) {
      return (
        <div
          style={{
            position: "fixed",
            inset: 0,
            background: "rgba(15,23,42,0.45)",
            backdropFilter: "blur(6px)",
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            zIndex: 100,
          }}
        >
          <div className="bg-white rounded-2xl shadow-2xl px-10 py-8 flex flex-col items-center gap-5 max-w-sm mx-4">
            <Spinner size={48} />
            <div className="text-center">
              <p className="text-slate-700 font-semibold text-base">{msg}</p>
              <p className="text-slate-400 text-xs mt-1">Please wait…</p>
            </div>
          </div>
        </div>
      );
    }

    function Alert({ type = "error", msg, onClose }) {
      if (!msg) return null;
      const styles = {
        error: "bg-red-50 border-red-200 text-red-800",
        warn: "bg-amber-50 border-amber-200 text-amber-800",
        info: "bg-blue-50 border-blue-200 text-blue-800",
        success: "bg-green-50 border-green-200 text-green-800",
      };
      const icons = { error: "⚠", warn: "⚡", info: "ℹ", success: "✓" };
      return (
        <div className={`mb-4 p-3.5 rounded-xl border flex items-start gap-2.5 ${styles[type]}`}>
          <span className="flex-shrink-0 font-bold mt-0.5">{icons[type]}</span>
          <pre className="flex-1 text-xs whitespace-pre-wrap break-all font-sans">{msg}</pre>
          {onClose && (
            <button
              onClick={onClose}
              className="flex-shrink-0 opacity-50 hover:opacity-100 transition-opacity ml-1"
            >
              ✕
            </button>
          )}
        </div>
      );
    }

    function StatusBadge({ row }) {
      if (needsReview(row)) {
        return (
          <span className="px-2.5 py-1 rounded-full text-[11px] font-bold bg-blue-50 text-blue-700 border border-blue-200">
            Needs review
          </span>
        );
      }
      if (row.approved) {
        return (
          <span className="px-2.5 py-1 rounded-full text-[11px] font-bold bg-green-50 text-green-700 border border-green-200">
            Approved
          </span>
        );
      }
      return (
        <span className="px-2.5 py-1 rounded-full text-[11px] font-bold bg-red-50 text-red-700 border border-red-200">
          Rejected
        </span>
      );
    }

    function FileList({ rows, onOpen, notice, error, onDismissError, onRefresh, loading }) {
      const [query, setQuery] = useState("");
      const shown = useMemo(() => {
        const q = query.trim().toLowerCase();
        if (!q) return rows;
        return rows.filter((row) =>
          `${row.project} ${row.filename} ${row.engine}`.toLowerCase().includes(q)
        );
      }, [rows, query]);
      const pending = rows.filter(needsReview).length;

      return (
        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
          <div className="px-8 py-6 bg-gradient-to-br from-blue-50 to-indigo-50 border-b border-slate-100">
            <div className="flex items-start justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 bg-blue-600 rounded-lg grid place-items-center text-white text-sm">
                  📂
                </div>
                <div>
                  <h2 className="text-xl font-bold text-slate-800">Files to review</h2>
                  <p className="text-slate-500 text-sm mt-0.5">
                    {`${rows.length} file${rows.length === 1 ? "" : "s"} in the review table${
                      pending > 0 ? ` · ${pending} waiting` : ""
                    }`}
                  </p>
                </div>
              </div>
              <button
                onClick={onRefresh}
                disabled={loading}
                className="px-3.5 py-2 text-xs font-semibold rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 disabled:opacity-50"
              >
                Refresh
              </button>
            </div>
          </div>

          <div className="p-8">
            <Alert type="success" msg={notice} />
            <Alert type="error" msg={error} onClose={onDismissError} />

            <input
              type="text"
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              placeholder="Filter by project, file, or engine"
              className="w-full mb-4 px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            />

            {shown.length === 0 ? (
              <div className="py-16 text-center text-sm text-slate-400">
                {rows.length === 0
                  ? "No files are in the review table yet."
                  : "No files match that filter."}
              </div>
            ) : (
              <div className="overflow-x-auto border border-slate-200 rounded-xl">
                <table className="w-full text-sm">
                  <thead className="bg-slate-50 text-left text-[11px] uppercase tracking-wide text-slate-500">
                    <tr>
                      <th className="px-4 py-3 font-semibold">File</th>
                      <th className="px-4 py-3 font-semibold">Project</th>
                      <th className="px-4 py-3 font-semibold">Engine</th>
                      <th className="px-4 py-3 font-semibold">Tokens</th>
                      <th className="px-4 py-3 font-semibold">Status</th>
                      <th className="px-4 py-3 font-semibold">Created</th>
                    </tr>
                  </thead>
                  <tbody>
                    {shown.map((row) => {
                      const open = needsReview(row);
                      return (
                        <tr
                          key={`${row.project}/${row.filename}/${row.engine}`}
                          role="button"
                          tabIndex={0}
                          onClick={() => onOpen(row)}
                          onKeyDown={(e) => {
                            if (e.key === "Enter" || e.key === " ") {
                              e.preventDefault();
                              onOpen(row);
                            }
                          }}
                          className={`border-t border-slate-100 ${
                            open
                              ? "cursor-pointer hover:bg-blue-50/60"
                              : "cursor-pointer hover:bg-slate-50"
                          }`}
                        >
                          <td className="px-4 py-3 font-medium text-slate-800">
                            <div>{row.filename}</div>
                            {row.processed && (
                              <div className="text-[10px] font-semibold text-slate-400 mt-0.5">Published</div>
                            )}
                            {row.require_chunking && !needsReview(row) && (
                              <div className="text-[10px] font-semibold text-amber-600 mt-0.5">Chunking requested</div>
                            )}
                          </td>
                          <td className="px-4 py-3 text-slate-600">{row.project}</td>
                          <td className="px-4 py-3 font-mono text-xs text-slate-500">{row.engine}</td>
                          <td className="px-4 py-3 text-slate-600">{Number(row.token_num).toLocaleString()}</td>
                          <td className="px-4 py-3"><StatusBadge row={row} /></td>
                          <td className="px-4 py-3 text-slate-500 whitespace-nowrap">{formatWhen(row.create_time)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
            <p className="text-xs text-slate-400 mt-3">
              Click a file that still needs review to open its markdown. Files that already have a decision stay in the list.
            </p>
          </div>
        </div>
      );
    }

    function LayoutPdf({ src }) {
      return (
        <div>
          <div className="flex items-center justify-between mb-2.5 gap-3">
            <div>
              <span className="text-sm font-semibold text-slate-700">Layout reference</span>
              <p className="text-xs text-slate-500 mt-0.5 leading-relaxed">
                Detected regions on the original pages. Compare them with the extracted text before accepting the parse.
              </p>
            </div>
            <a
              href={src}
              target="_blank"
              rel="noreferrer"
              className="flex-shrink-0 text-xs font-semibold text-blue-600 hover:text-blue-700"
            >
              Open PDF
            </a>
          </div>
          <iframe
            title="MinerU layout PDF"
            src={src}
            className="review-pane w-full rounded-xl border border-slate-200 bg-slate-100"
          />
        </div>
      );
    }

    function MdPreview({ text, row }) {
      const html = useMemo(() => {
        if (!text || !text.trim())
          return '<p style="color:#94a3b8;font-style:italic">No content available.</p>';
        let rendered;
        try { rendered = marked.parse(text); }
        catch { rendered = `<pre style="white-space:pre-wrap">${text}</pre>`; }
        return rendered.replace(/(<img\b[^>]*\bsrc=["'])([^"']+)(["'])/gi, (match, pre, src, post) => {
          if (/^(https?:|data:|blob:|\/)/i.test(src)) return match;
          const abs = assetUrl(row, src).replace(/&/g, "&amp;");
          return pre + abs + post;
        });
      }, [text, row]);

      return (
        <div
          className="review-pane md p-5 bg-white border border-slate-200 rounded-xl overflow-y-auto text-sm leading-relaxed"
          dangerouslySetInnerHTML={{ __html: html }}
        />
      );
    }

    function ContentReview({ req, onSubmit, onBack }) {
      const [view, setView] = useState("preview");
      const [text, setText] = useState(req.content || "");
      const [approved, setApproved] = useState(true);
      const [chunking, setChunking] = useState(false);
      const [err, setErr] = useState("");

      const effectiveApproved = req.permit_reject ? approved : true;

      const handleSubmit = async () => {
        setErr("");
        if (effectiveApproved && !text.trim()) {
          setErr("Cannot approve empty content. Please add text or switch to Reject.");
          return;
        }
        try {
          await onSubmit({
            approved: effectiveApproved,
            text: effectiveApproved ? text : null,
            requireChunking: effectiveApproved && (chunking || !req.ask_chunking),
            createTime: req.create_time,
          });
        } catch (e) {
          setErr(e.message);
        }
      };

      return (
        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
          <div className="px-8 py-6 border-b border-slate-100 bg-gradient-to-br from-green-50 to-emerald-50">
            <div className="flex items-start justify-between gap-4">
              <div className="flex items-center gap-3">
                <button
                  onClick={onBack}
                  className="w-8 h-8 rounded-lg border border-slate-200 bg-white text-slate-500 hover:text-slate-800"
                  title="Back to files"
                >
                  ←
                </button>
                <div>
                  <h2 className="text-xl font-bold text-slate-800">Content Review</h2>
                  <p className="text-slate-500 text-sm mt-0.5">
                    {req.has_layout
                      ? "Compare the layout reference with the extracted text, then approve or reject the parse."
                      : "Review the extracted text. You may edit it before approving."}
                  </p>
                  <p className="text-xs text-slate-400 mt-1 font-mono">
                    {req.project} / {req.filename} · {req.engine}
                  </p>
                </div>
              </div>
              <div className="flex flex-col items-end gap-1.5 flex-shrink-0">
                {req.token_num != null && (
                  <span className="px-3 py-1 bg-white border border-blue-200 text-blue-700 text-xs font-bold rounded-full shadow-sm">
                    ~{Number(req.token_num).toLocaleString()} tokens
                  </span>
                )}
              </div>
            </div>
          </div>

          <div className="p-8 space-y-6">
            <Alert type="error" msg={err} onClose={() => setErr("")} />

            <div className={req.has_layout ? "grid grid-cols-1 lg:grid-cols-2 gap-6 items-start" : ""}>
              {req.has_layout && <LayoutPdf src={layoutUrl(req)} />}

              <div>
                <div className="flex items-center justify-between mb-2.5">
                  <span className="text-sm font-semibold text-slate-700">Extracted Content</span>
                  <div className="flex border border-slate-200 rounded-lg overflow-hidden text-xs font-semibold">
                    {["preview", "edit"].map((m) => (
                      <button
                        key={m}
                        onClick={() => setView(m)}
                        className={`px-3.5 py-1.5 transition-colors ${
                          view === m
                            ? "bg-slate-800 text-white"
                            : "bg-white text-slate-500 hover:bg-slate-50"
                        }`}
                      >
                        {m === "preview" ? "👁 Preview" : "✏️ Edit"}
                      </button>
                    ))}
                  </div>
                </div>

                {view === "preview" ? (
                  <MdPreview text={text} row={req} />
                ) : (
                  <textarea
                    value={text}
                    onChange={(e) => setText(e.target.value)}
                    placeholder="Extracted content will appear here…"
                    className="review-pane w-full px-4 py-3 border border-slate-300 rounded-xl text-sm font-mono leading-relaxed focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-y transition-all"
                  />
                )}
              </div>
            </div>

            {!req.permit_reject && (
              <Alert
                type="info"
                msg="This document exceeds the token threshold. It will be automatically processed and chunked — rejection is not available."
              />
            )}

            {req.permit_reject && (
              <div>
                <p className="text-sm font-semibold text-slate-700 mb-3">Your Decision</p>
                <div className="grid grid-cols-2 gap-3">
                  <button
                    onClick={() => setApproved(true)}
                    className={`py-4 rounded-xl border-2 font-bold text-sm transition-all ${
                      approved
                        ? "border-green-500 bg-green-50 text-green-700 shadow shadow-green-100"
                        : "border-slate-200 bg-white text-slate-400 hover:border-green-300 hover:text-green-600 hover:bg-green-50"
                    }`}
                  >
                    ✓&nbsp; Approve
                  </button>
                  <button
                    onClick={() => setApproved(false)}
                    className={`py-4 rounded-xl border-2 font-bold text-sm transition-all ${
                      !approved
                        ? "border-red-500 bg-red-50 text-red-700 shadow shadow-red-100"
                        : "border-slate-200 bg-white text-slate-400 hover:border-red-300 hover:text-red-600 hover:bg-red-50"
                    }`}
                  >
                    ✗&nbsp; Reject
                  </button>
                </div>
              </div>
            )}

            {effectiveApproved && req.ask_chunking && (
              <div className="p-4 bg-amber-50 border border-amber-200 rounded-xl">
                <label className="flex items-start gap-3 cursor-pointer group">
                  <input
                    type="checkbox"
                    checked={chunking}
                    onChange={(e) => setChunking(e.target.checked)}
                    className="mt-0.5 w-4 h-4 rounded flex-shrink-0"
                    style={{ accentColor: "#d97706" }}
                  />
                  <div>
                    <span className="text-sm font-bold text-amber-900 group-hover:text-amber-700 transition-colors">
                      Enable Chunking
                    </span>
                    <p className="text-xs text-amber-700 mt-0.5 leading-relaxed">
                      Splits the approved text into overlapping chunks for improved search
                      precision. Recommended for large documents
                      {req.token_num != null ? ` (this document: ~${Number(req.token_num).toLocaleString()} tokens)` : ""}.
                    </p>
                  </div>
                </label>
              </div>
            )}

            {effectiveApproved && !req.ask_chunking && (
              <Alert
                type="info"
                msg="This document exceeds 5,000 tokens. Publishing will split it into chunks."
              />
            )}

            {req.permit_reject && !approved && (
              <Alert
                type="warn"
                msg="This content will be rejected. The pipeline will fall back to VLM to generate keyword and semantic texts."
              />
            )}

            <button
              onClick={handleSubmit}
              className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-bold rounded-xl transition-all shadow shadow-blue-200 text-sm"
            >
              Submit Review →
            </button>
          </div>
        </div>
      );
    }

    function App() {
      const [view, setView] = useState("list");
      const [rows, setRows] = useState([]);
      const [review, setReview] = useState(null);
      const [loading, setLoading] = useState(false);
      const [loadMsg, setLoadMsg] = useState("");
      const [error, setError] = useState("");
      const [notice, setNotice] = useState("");

      const loadFiles = async () => {
        setLoadMsg("Loading review files…");
        setLoading(true);
        try {
          const data = await api("GET", "/reviews");
          setRows(Array.isArray(data) ? data : []);
          setError("");
        } catch (e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => { loadFiles(); }, []);

      const openRow = async (row) => {
        if (!needsReview(row)) {
          setNotice("");
          setError(`${row.filename} has already been reviewed.`);
          return;
        }
        setLoadMsg("Opening review…");
        setLoading(true);
        setError("");
        setNotice("");
        try {
          const detail = await api("GET", filePath(row), fileQuery(row));
          setReview(detail);
          setView("review");
        } catch (e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      };

      const submitReview = async ({ approved, text, requireChunking, createTime }) => {
        setLoadMsg("Saving review…");
        setLoading(true);
        try {
          const saved = await api("POST", filePath(review), fileQuery(review), {
            approved,
            text,
            require_chunking: requireChunking,
            create_time: createTime,
          });
          const decision = saved.approved ? "Approved" : "Rejected";
          const chunking = saved.require_chunking ? "chunking on" : "chunking off";
          setNotice(
            `${decision} ${saved.filename}. ${Number(saved.token_num).toLocaleString()} tokens, ${chunking}.`
          );
          setReview(null);
          setView("list");
          const data = await api("GET", "/reviews");
          setRows(Array.isArray(data) ? data : []);
        } finally {
          setLoading(false);
        }
      };

      const wide = view === "review" && review && review.has_layout;

      return (
        <div className="min-h-screen bg-slate-50">
          {loading && <LoadingOverlay msg={loadMsg} />}

          <header className="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
            <div className={`${wide ? "max-w-screen-2xl" : "max-w-5xl"} mx-auto px-4 sm:px-6 h-14 flex items-center justify-between`}>
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 bg-blue-600 rounded-lg grid place-items-center text-white font-black text-xs shadow shadow-blue-200">
                  RV
                </div>
                <div className="leading-tight">
                  <p className="text-sm font-bold text-slate-800">Document Review</p>
                  <p className="text-[10px] text-slate-400 hidden sm:block">Review table · editable markdown</p>
                </div>
              </div>
            </div>
          </header>

          <main className={`${wide ? "max-w-screen-2xl" : "max-w-5xl"} mx-auto px-4 sm:px-6 py-10`}>
            {view === "list" && (
              <FileList
                rows={rows}
                onOpen={openRow}
                notice={notice}
                error={error}
                onDismissError={() => setError("")}
                onRefresh={loadFiles}
                loading={loading}
              />
            )}

            {view === "review" && review && (
              <ContentReview
                key={`${review.project}/${review.filename}/${review.engine}/${review.create_time}`}
                req={review}
                onSubmit={submitReview}
                onBack={() => { setView("list"); setReview(null); }}
              />
            )}
          </main>

          <footer className="text-center text-[10px] text-slate-300 py-6 font-mono">
            Document Review · Management
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
